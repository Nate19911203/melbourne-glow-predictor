<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2442" id="theme-color">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glow">
  <title>Melbourne Glow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Melbourne glow</h1>
        <p class="date" id="date"></p>
      </div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Refresh forecast">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </header>

    <section class="hero" aria-live="polite">
      <svg class="scene" id="scene" role="img" aria-label="Illustration of the horizon"></svg>
      <div class="hero-copy">
        <p class="hero-when" id="hero-when">&nbsp;</p>
        <p class="hero-score"><span id="hero-score">--</span><span class="pct">%</span></p>
        <p class="hero-rating" id="hero-rating">&nbsp;</p>
        <p class="hero-summary" id="hero-summary">Loading forecast…</p>
      </div>
    </section>

    <nav class="switch" role="tablist" aria-label="Choose event">
      <button role="tab" type="button" data-event="sunrise">
        <span class="swatch"></span>
        <span class="switch-text">
          <span class="switch-name">Sunrise</span>
          <span class="switch-time">--:--</span>
        </span>
        <span class="switch-score">--</span>
      </button>
      <button role="tab" type="button" data-event="sunset">
        <span class="swatch"></span>
        <span class="switch-text">
          <span class="switch-name">Sunset</span>
          <span class="switch-time">--:--</span>
        </span>
        <span class="switch-score">--</span>
      </button>
    </nav>

    <section class="briefing">
      <h2 id="briefing-title">Conditions</h2>
      <dl class="stats" id="stats"></dl>
    </section>

    <footer class="footer">
      <span id="status"></span>
      <span>Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></span>
    </footer>
  </main>

  <script src="src/vendor/suncalc.js"></script>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
