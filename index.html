<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Melbourne Glow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Melbourne Glow</h1>
      <p class="date" id="date"></p>
    </header>

    <section class="cards">
      <article class="card" id="sunrise">
        <div class="card-head">
          <h2>Sunrise</h2>
          <span class="time" data-field="time">--:--</span>
        </div>
        <div class="score"><span data-field="score">--</span><small>%</small></div>
        <div class="bar"><div class="bar-fill" data-field="bar"></div></div>
        <p class="summary" data-field="summary">Loading forecast…</p>
        <dl class="details" data-field="details"></dl>
      </article>

      <article class="card" id="sunset">
        <div class="card-head">
          <h2>Sunset</h2>
          <span class="time" data-field="time">--:--</span>
        </div>
        <div class="score"><span data-field="score">--</span><small>%</small></div>
        <div class="bar"><div class="bar-fill" data-field="bar"></div></div>
        <p class="summary" data-field="summary">Loading forecast…</p>
        <dl class="details" data-field="details"></dl>
      </article>
    </section>

    <p class="status" id="status"></p>
    <footer class="footer">
      Forecast data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="src/vendor/suncalc.js"></script>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
